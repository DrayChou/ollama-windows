[project]
name = "ollama-windows"
version = "1.0.0"
description = "Ollama Windows Manager - A GUI application for managing Ollama on Windows"
authors = [{name = "Ollama Windows Team"}]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "pillow>=9.0.0",
    "urllib3>=1.26.0",
    "certifi>=2022.0.0",
    "wmi>=1.5.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
ollama-manager = "ollama_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pyinstaller>=5.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
